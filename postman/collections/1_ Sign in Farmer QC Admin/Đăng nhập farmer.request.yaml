$kind: http-request
description: "Đăng nhập farmer\r\n"
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"farmer10\",\r

    \    \"password\": \"farmer10@12345\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "if (pm.response.code === 200) {\r

      \    const data = pm.response.json();\r

      \r

      \    if (typeof data.accessToken === \"string\") {\r

      \        pm.environment.set(\r

      \            \"accessFarmer\",\r

      \            data.accessToken\r

      \        );\r

      \    }\r

      }"
    language: text/javascript
order: 3000
