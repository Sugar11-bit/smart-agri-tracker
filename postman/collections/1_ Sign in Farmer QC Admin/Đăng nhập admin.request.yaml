  content: |-
    {
      "username": "admin01",
      "password": "Duong@13042005"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "\r

      if (pm.response.code === 200) {\r

      \    const data = pm.response.json();\r

      \r

      \    if (typeof data.accessToken === \"string\") {\r

      \        pm.environment.set(\r

      \            \"accessToken\",\r

      \            data.accessToken\r

      \        );\r

      \    }\r

      }\r\n"
    language: text/javascript
