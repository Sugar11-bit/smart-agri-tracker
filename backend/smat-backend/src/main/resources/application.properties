spring.application.name=smat-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smat_dev
spring.datasource.username=smat_app
spring.datasource.password=${SMAT_DB_PASSWORD}

# JPA: Flyway manages the database schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# HTTP server
server.port=8080


# JWT Authentication
smat.jwt.secret=${SMAT_JWT_SECRET}
smat.jwt.issuer=smat-backend
smat.jwt.access-token-minutes=120

smat.bootstrap.enabled=${SMAT_BOOTSTRAP_ENABLED:false}
smat.bootstrap.username=${SMAT_BOOTSTRAP_USERNAME:}
smat.bootstrap.password=${SMAT_BOOTSTRAP_PASSWORD:}
smat.bootstrap.organization-id=${SMAT_BOOTSTRAP_ORGANIZATION_ID:12}
# Optional private configuration for this workstation; excluded from Git.
spring.config.import=optional:file:./.smat/application-local.yml

