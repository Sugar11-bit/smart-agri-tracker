# Test classpath only: never connect application-context/security tests to smat_dev.
spring.application.name=smat-backend-test
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
server.address=127.0.0.1
server.port=0
smat.bootstrap.enabled=false
smat.jwt.issuer=smat-backend
smat.jwt.access-token-minutes=120
# Public test fixture key (32 bytes), not a credential for any running environment.
smat.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
